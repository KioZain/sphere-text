<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sphere Typography — объёмная типографика</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <aside class="panel">
        <header class="panel__header">
          <h1>Sphere Typography</h1>
          <p>Текст на сфере с объёмным эффектом</p>
        </header>

        <section class="section">
          <h2 class="section__title">Текст</h2>
          <div id="blocks"></div>
          <button type="button" class="btn btn--secondary" id="add-block-btn">
            + Добавить строку
          </button>
          <p class="field__hint" id="fonts-status"></p>
        </section>

        <section class="section">
          <h2 class="section__title">Настройки текста</h2>

          <label class="field">
            <span class="field__label">Расстояние между блоками</span>
            <input type="range" id="block-gap" min="40" max="260" value="120" />
            <span class="field__hint" id="block-gap-value">1.20×</span>
          </label>

          <label class="field">
            <span class="field__label">Наклон текста</span>
            <input type="range" id="text-angle" min="-45" max="45" value="0" />
            <span class="field__hint" id="text-angle-value">0°</span>
          </label>

          <label class="field">
            <span class="field__label">Масштаб</span>
            <input type="range" id="scale" min="20" max="400" value="100" />
            <span class="field__hint" id="scale-value">100%</span>
          </label>
        </section>

        <section class="section">
          <h2 class="section__title">Камера</h2>

          <label class="field">
            <span class="field__label">Фокусное расстояние</span>
            <span class="field-suffix">
              <input
                type="number"
                id="focal-length"
                list="focal-length-presets"
                min="24"
                max="200"
                step="1"
                value="50"
              />
              <span class="field-suffix__unit">мм</span>
            </span>
            <span class="field__hint">
              24 мм — сильная перспектива, текст выпучивается; 200 мм — плоская
              «телевик»-картинка, по краям видно больше текста. Размер сферы
              в кадре сохраняется.
            </span>
          </label>
        </section>

        <section class="section">
          <h2 class="section__title">Цвет</h2>

          <div class="field-row">
            <label class="field field--color">
              <span class="field__label">Цвет текста</span>
              <input type="color" id="text-color" value="#ff6a00" />
            </label>
            <label class="field field--color">
              <span class="field__label">Фон страницы</span>
              <input type="color" id="page-bg-color" value="#080b14" />
            </label>
          </div>

          <label class="toggle">
            <input type="checkbox" id="transparent-sphere" />
            <span class="toggle__track" aria-hidden="true"></span>
            <span class="toggle__label">Прозрачная сфера (только текст)</span>
          </label>
        </section>

        <button type="button" class="btn" id="save-btn">Экспортировать в SVG</button>
        <button type="button" class="btn btn--secondary" id="export-settings-btn">
          Экспортировать настройки
        </button>

        <p class="hint" id="viewport-hint">
          Перетаскивайте сферу мышью или пальцем для вращения
        </p>
      </aside>

      <main class="viewport">
        <canvas id="canvas"></canvas>
      </main>
    </div>

    <!-- Пресеты размера шрифта (как в Figma). Ручной ввод тоже работает. -->
    <datalist id="font-size-presets">
      <option value="10"></option>
      <option value="11"></option>
      <option value="12"></option>
      <option value="13"></option>
      <option value="14"></option>
      <option value="15"></option>
      <option value="16"></option>
      <option value="20"></option>
      <option value="24"></option>
      <option value="32"></option>
      <option value="36"></option>
      <option value="40"></option>
      <option value="48"></option>
      <option value="64"></option>
      <option value="96"></option>
      <option value="128"></option>
    </datalist>

    <!-- Классический ряд фокусных расстояний. Ручной ввод тоже работает. -->
    <datalist id="focal-length-presets">
      <option value="24"></option>
      <option value="28"></option>
      <option value="35"></option>
      <option value="50"></option>
      <option value="85"></option>
      <option value="105"></option>
      <option value="135"></option>
      <option value="200"></option>
    </datalist>

    <!-- Шаблон одного текстового блока -->
    <template id="block-template">
      <div class="block" draggable="false">
        <div class="block__head">
          <span class="block__handle" title="Перетащить" aria-label="Перетащить">⠿</span>
          <span class="block__title">Строка 1</span>
          <button type="button" class="block__delete" title="Удалить строку" aria-label="Удалить строку">✕</button>
        </div>
        <textarea class="block__text" rows="2" spellcheck="false" placeholder="Введите текст"></textarea>
        <div class="field-row field-row--size">
          <label class="field">
            <select class="block__weight">
              <option value="400">Regular</option>
              <option value="700">Bold</option>
            </select>
          </label>
          <label class="field">
            <input type="number" class="block__size" list="font-size-presets" min="1" max="2000" step="1" />
          </label>
        </div>
        <label class="field">
          <span class="field__hint">Интерлиньяж</span>
          <input type="range" class="block__linefactor" min="60" max="220" value="80" />
          <span class="field__hint block__linefactor-value">0.80×</span>
        </label>
      </div>
    </template>

    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.module.js",
          "three/addons/": "./vendor/three-addons/",
          "opentype": "./vendor/opentype.module.js"
        }
      }
    </script>
    <script type="module" src="main.js"></script>
  </body>
</html>
